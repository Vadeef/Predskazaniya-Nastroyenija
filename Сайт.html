
<!DOCTYPE html>

    <title>Генератор предсказаний</title>
    <style>

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .box {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #28a745; /* Сделали кнопку зеленой для разнообразия! */
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }
        button:hover { background-color: #218838; }
        p { font-size: 18px; color: #333; min-height: 60px; line-height: 1.5; }
    </style>
</head>
